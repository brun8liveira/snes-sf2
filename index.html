<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Snes Super Mario World</title>

  <style>
    html, body {
      margin: 0;
      background: black;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }

    #game {
      width: 100vw;
      height: 100vh;
      transition: transform 0.3s ease; /* suaviza a mudança */
    }

    /* Ajuste para orientação vertical (portrait) */
    @media (orientation: portrait) {
      #game {
        transform: translateY(-15%); /* sobe 15% */
      }
    }

    /* Botão de fullscreen – canto superior ESQUERDO */
    #fullscreen-btn {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 20;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
      display: none;
    }

    /* Overlay de toque */
    #overlay {
      position: fixed;
      inset: 0;
      background: black;
      color: white;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      cursor: pointer;
    }
  </style>

  <script>
    EJS_player = "#game";
    EJS_core = "snes";
    EJS_gameUrl = "roms/sf2.sfc";
    EJS_pathtodata = "data/";
    EJS_startOnLoaded = true;
    EJS_fullscreenOnLoaded = false;
  </script>
  <script src="data/loader.js"></script>
</head>
<body>

  <div id="overlay">▶ TOCAR PARA JOGAR</div>
  <div id="fullscreen-btn">⛶ Tela cheia</div>
  <div id="game"></div>

  <script>
    const overlay = document.getElementById("overlay");
    const fsBtn   = document.getElementById("fullscreen-btn");

    async function enterFullscreen() {
      const el = document.documentElement;
      if (el.requestFullscreen) {
        try {
          await el.requestFullscreen();
        } catch (e) {
          console.log("Erro ao tentar fullscreen:", e);
        }
      }
    }

    function updateFullscreenButton() {
      const isFullscreen = document.fullscreenElement != null;
      fsBtn.style.display = isFullscreen ? "none" : "block";
    }

    document.addEventListener("fullscreenchange", updateFullscreenButton);

    overlay.addEventListener("click", async () => {
      overlay.remove();
      await enterFullscreen();
    });

    fsBtn.addEventListener("click", async () => {
      await enterFullscreen();
    });

    window.addEventListener("touchmove", e => e.preventDefault(), { passive: false });

    updateFullscreenButton();
  </script>

</body>
</html>
